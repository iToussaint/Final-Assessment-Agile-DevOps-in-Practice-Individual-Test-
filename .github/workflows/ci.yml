name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Format check (ruff format)
        run: ruff format --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage gate (>= 90%)
        run: >
          pytest -v
          --cov=library --cov=main
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90
          --junitxml=test-reports/junit.xml

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            test-reports/junit.xml
            coverage.xml

  smoke:
    name: CLI smoke test & health endpoint
    needs: test
    runs-on: ubuntu-latest
    env:
      LIBRARY_DATA_FILE: /tmp/smoke/library.json
      LIBRARY_LOG_FILE: /tmp/smoke/library.log
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Exercise the CLI end-to-end
        run: |
          set -euxo pipefail
          python main.py --version
          python main.py add-book --title "Things Fall Apart" --author "Chinua Achebe" \
            --isbn 9780385474542 --genre Novel --year 1958
          python main.py list | grep "Things Fall Apart"
          python main.py search achebe --field author | grep "B001"
          python main.py health

      - name: Probe the HTTP health endpoint
        run: |
          set -euxo pipefail
          python main.py serve-health --port 8080 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8080/health | python -c "import json,sys; assert json.load(sys.stdin)['status'] == 'ok'"
          kill %1

      - name: Show application log
        if: always()
        run: cat "$LIBRARY_LOG_FILE"
