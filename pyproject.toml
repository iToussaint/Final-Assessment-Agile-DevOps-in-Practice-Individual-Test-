[project]
name = "library-inventory"
version = "0.1.0"
description = "Command-line Library Inventory Application (Agile & DevOps final assessment)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Toussaint Iradukunda" }]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, naming, simplify
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
